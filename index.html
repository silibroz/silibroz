<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silibroz — A Collective of Brands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <div class="logo">SILIBROZ</div>
    <a href="about.html" class="nav-btn">About Us</a>
  </nav>

  <section class="hero">
   <div class="hero-img-wrap">
      <img src="hero.png" alt="Silibroz" class="hero-img desktop-img" />
      <img src="hero-mobile.png" alt="Silibroz" class="hero-img mobile-img" />
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <a href="#brands" class="hero-cta">Explore Now</a>
    </div>
  </section>

 <section class="brands-section" id="brands">
    <div class="section-label">— our brands</div>
    <div class="cards-grid">

      <a href="brands/hermoza.html" class="card">
        <div class="card-img">
          <img src="brands/hermoza.png" alt="Hermoza" />
        </div>
        <div class="card-body">
          <div class="card-title">HERMOZA</div>
          <div class="card-sub">Streetwear / Apparel</div>
          <div class="card-link">Visit Brand →</div>
        </div>
      </a>

    </div>
  </section>

  <footer class="footer">
    <div class="footer-text"><span class="dot"></span>SILIBROZ © 2026</div>
    <div class="footer-text">SILIGURI, IN</div>
  </footer>

</body>
</html>
